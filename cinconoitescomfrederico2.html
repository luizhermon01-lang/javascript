<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com Validação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .form-grupo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            padding: 8px;
            width: 250px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
        #mensagem {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Formulário de Cadastro</h2>

    <div class="form-grupo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
    </div>

    <div class="form-grupo">
        <label for="email">Email:</label>
        <input type="email" id="email">
    </div>

    <div class="form-grupo">
        <label for="senha">Senha:</label>
        <input type="password" id="senha">
    </div>

    <button onclick="validarCadastro()">Cadastrar</button>

    <p id="mensagem"></p>

    <script>
        function validarCadastro() {
            
            var nome = document.getElementById("nome").value.trim();
            var email = document.getElementById("email").value.trim();
            var senha = document.getElementById("senha").value.trim();
            var mensagemElemento = document.getElementById("mensagem");

            
            if (nome === "" || email === "" || senha === "") {
                mensagemElemento.style.color = "red";
                mensagemElemento.innerText = "Preencha todos os campos";
            } 
            else if (senha.length < 6) {
                mensagemElemento.style.color = "red";
                mensagemElemento.innerText = "Senha muito curta";
            } 
            else {
                mensagemElemento.style.color = "green";
                mensagemElemento.innerText = "Cadastro realizado com sucesso";
                
                
                document.getElementById("nome").value = "";
                document.getElementById("email").value = "";
                document.getElementById("senha").value = "";
            }
        }
    </script>

</body>
</html>
